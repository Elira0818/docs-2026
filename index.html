<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>文档库</title><style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#1f2328;--sub:#656d76;--line:#d8dee4;--accent:#0969da;--soft:#ddf4ff;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
 line-height:1.75;font-size:16px;}
.wrap{max-width:880px;margin:0 auto;padding:32px 20px 80px}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;
 display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.topbar a{color:var(--accent);text-decoration:none;font-weight:600}
.crumb{color:var(--sub);font-size:14px}
h1{font-size:26px;margin:8px 0 4px;line-height:1.4}
h2{font-size:21px;margin:30px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h3{font-size:18px;margin:22px 0 8px}
.meta{color:var(--sub);font-size:13px;margin:0 0 26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 24px;margin-bottom:18px}
p{margin:0 0 12px;white-space:pre-wrap;word-break:break-word}
img{max-width:100%;height:auto;border-radius:6px;margin:10px 0;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:#f0f3f6;font-weight:600;white-space:nowrap}
tr:nth-child(even) td{background:#fafbfc}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tab{padding:6px 14px;border:1px solid var(--line);background:var(--card);border-radius:999px;
 cursor:pointer;font-size:14px;color:var(--sub)}
.tab.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.sheet{display:none}.sheet.on{display:block}
.note{background:#fff8c5;border:1px solid #d4a72c;border-radius:8px;padding:12px 16px;font-size:14px;margin:14px 0}
.empty{color:var(--sub);font-style:italic}
.btn{display:inline-block;background:var(--accent);color:#fff;padding:9px 18px;border-radius:8px;
 text-decoration:none;font-weight:600;font-size:14px}
.btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;
 display:block;text-decoration:none;color:inherit;transition:.15s}
.item:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(9,105,218,.12)}
.item h3{margin:0 0 6px;font-size:17px}
.item .k{display:inline-block;background:var(--soft);color:var(--accent);font-size:12px;
 padding:2px 9px;border-radius:999px;margin-bottom:8px}
.item .m{color:var(--sub);font-size:13px;margin:0}
.hero{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 24px;margin-bottom:20px}
.hero h1{margin:0 0 6px;font-size:22px}
.hero p{margin:0;color:var(--sub);font-size:14px}
code{background:#f0f3f6;padding:2px 6px;border-radius:4px;font-size:13px}
